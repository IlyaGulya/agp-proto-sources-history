name: Import AGP protobuf releases

on:
  schedule:
    - cron: "7 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: import-agp-protobuf-releases
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Find new AGP releases
        id: releases
        shell: bash
        run: |
          versions="$(bun scripts/find_releases.ts)"
          echo "versions=$versions" >> "$GITHUB_OUTPUT"

      - name: Import each release as a commit
        if: steps.releases.outputs.versions != ''
        shell: bash
        env:
          VERSIONS: ${{ steps.releases.outputs.versions }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          versions=($VERSIONS)
          batch_size=20

          for ((start = 0; start < ${#versions[@]}; start += batch_size)); do
            batch=("${versions[@]:start:batch_size}")
            pids=()
            for version in "${batch[@]}"; do
              AGP_SOURCE_WORKERS=8 bun scripts/resolve_allowed_sources.ts "$version" \
                "build/agp-sources/$version" "build/source-cache" \
                "build/source-manifests/$version.json" &
              pids+=("$!")
              if (( ${#pids[@]} == 4 )); then
                wait "${pids[0]}"
                pids=("${pids[@]:1}")
              fi
            done
            for pid in "${pids[@]}"; do wait "$pid"; done

            for version in "${batch[@]}"; do
              scripts/import_release.sh "$version" "build/agp-sources/$version"
              git push origin "HEAD:${GITHUB_REF_NAME}"
              git push origin "agp-$version"
            done

            git gc
            find build/agp-sources -mindepth 1 -delete
          done
